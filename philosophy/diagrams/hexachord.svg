<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
  <title id="t">Guidonian hexachord</title>
  <desc id="d">Medieval solmization syllables</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0618"/><stop offset="100%" stop-color="#120a28"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="680" height="400" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="678" height="398" rx="17" fill="none" stroke="rgba(122,240,255,0.22)" stroke-width="1.5"/>
  <text x="36" y="42" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.08em">GUIDONIAN HEXACHORD</text>
<text x="36" y="64" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">ut re mi fa sol la — medieval solmization (ancestor of do-re-mi)</text>
<circle cx="80" cy="160" r="28" fill="#120a28" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<text x="80" y="166" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">ut</text>
<line x1="110" y1="160" x2="145" y2="160" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
<circle cx="175" cy="160" r="28" fill="#120a28" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
<text x="175" y="166" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">re</text>
<line x1="205" y1="160" x2="240" y2="160" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
<circle cx="270" cy="160" r="28" fill="#120a28" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
<text x="270" y="166" text-anchor="middle" fill="#a78bfa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">mi</text>
<line x1="300" y1="160" x2="335" y2="160" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
<circle cx="365" cy="160" r="28" fill="#120a28" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
<text x="365" y="166" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">fa</text>
<line x1="395" y1="160" x2="430" y2="160" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
<circle cx="460" cy="160" r="28" fill="#120a28" stroke="#fb7185" stroke-width="2" filter="url(#glow)"/>
<text x="460" y="166" text-anchor="middle" fill="#fb7185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">sol</text>
<line x1="490" y1="160" x2="525" y2="160" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
<circle cx="555" cy="160" r="28" fill="#120a28" stroke="#60a5fa" stroke-width="2" filter="url(#glow)"/>
<text x="555" y="166" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">la</text>
<text x="36" y="230" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Hand &amp; hymn pedagogy made pitch portable before full staff literacy.</text>
<text x="36" y="260" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Mutation between hexachords let singers navigate wider ranges.</text>
<line x1="60" y1="300" x2="620" y2="300" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
<line x1="60" y1="314" x2="620" y2="314" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
<line x1="60" y1="328" x2="620" y2="328" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
<line x1="60" y1="342" x2="620" y2="342" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
<line x1="60" y1="356" x2="620" y2="356" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
<text x="36" y="290" fill="#a78bfa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Staff sketch (Guido’s lineage)</text>
<ellipse cx="100" cy="356" rx="10" ry="7" fill="#7af0ff" transform="rotate(-20 100 356)"/>
<ellipse cx="185" cy="349" rx="10" ry="7" fill="#34d399" transform="rotate(-20 185 349)"/>
<ellipse cx="270" cy="342" rx="10" ry="7" fill="#a78bfa" transform="rotate(-20 270 342)"/>
<ellipse cx="355" cy="335" rx="10" ry="7" fill="#fbbf24" transform="rotate(-20 355 335)"/>
<ellipse cx="440" cy="328" rx="10" ry="7" fill="#fb7185" transform="rotate(-20 440 328)"/>
<ellipse cx="525" cy="321" rx="10" ry="7" fill="#60a5fa" transform="rotate(-20 525 321)"/>
  <text x="36" y="382" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Cosmoly diagram</text>
</svg>
