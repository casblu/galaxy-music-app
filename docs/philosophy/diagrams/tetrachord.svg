<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="t d">
  <title id="t">Tetrachord and conjunct octave</title>
  <desc id="d">Four-note spans as Greek and medieval building blocks</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0618"/><stop offset="100%" stop-color="#120a28"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="680" height="440" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="678" height="438" rx="17" fill="none" stroke="rgba(122,240,255,0.22)" stroke-width="1.5"/>
  <text x="36" y="42" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.08em">TETRACHORD</text>
<text x="36" y="64" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Four-note spans (perfect fourth) — building block of Greek &amp; medieval theory</text>
<text x="36" y="100" fill="#a78bfa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Diatonic tetrachord (tone–semitone–tone)</text>
<circle cx="80" cy="150" r="16" fill="#120a28" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<text x="80" y="155" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">E</text>
<circle cx="150" cy="150" r="16" fill="#120a28" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<text x="150" y="155" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">F</text>
<circle cx="290" cy="150" r="16" fill="#120a28" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<text x="290" y="155" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">G</text>
<circle cx="430" cy="150" r="16" fill="#120a28" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<text x="430" y="155" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">A</text>
<text x="115.0" y="190" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">S</text>
<line x1="98" y1="150" x2="132" y2="150" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
<text x="220.0" y="190" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">T</text>
<line x1="168" y1="150" x2="272" y2="150" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
<text x="360.0" y="190" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">T</text>
<line x1="308" y1="150" x2="412" y2="150" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
<text x="470" y="155" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">= perfect 4th</text>
<text x="36" y="240" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Two conjunct tetrachords → octave</text>
<rect x="38" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#7af0ff" stroke-width="1.6"/>
<text x="60" y="298" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">A</text>
<rect x="110" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#7af0ff" stroke-width="1.6"/>
<text x="132" y="298" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">B</text>
<rect x="182" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#7af0ff" stroke-width="1.6"/>
<text x="204" y="298" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">C</text>
<rect x="254" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#7af0ff" stroke-width="1.6"/>
<text x="276" y="298" text-anchor="middle" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">D</text>
<rect x="326" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#34d399" stroke-width="1.6"/>
<text x="348" y="298" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">E</text>
<rect x="398" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#34d399" stroke-width="1.6"/>
<text x="420" y="298" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">F</text>
<rect x="470" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#34d399" stroke-width="1.6"/>
<text x="492" y="298" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">G</text>
<rect x="542" y="270" width="44" height="44" rx="10" fill="#120a28" stroke="#34d399" stroke-width="1.6"/>
<text x="564" y="298" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">A</text>
<text x="60" y="340" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">lower tetrachord</text>
<text x="348" y="340" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">upper tetrachord</text>
<text x="250" y="365" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">disjunction tone at D–E</text>
<text x="36" y="400" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Related: Guidonian hexachord (ut–re–mi–fa–sol–la) nests tetrachord logic into pedagogy.</text>
  <text x="36" y="422" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Cosmoly diagram</text>
</svg>
