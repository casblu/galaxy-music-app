<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
  <title id="t">Pythagorean ratios on the monochord</title>
  <desc id="d">Classic string divisions for unison fourth fifth octave</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0618"/><stop offset="100%" stop-color="#120a28"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="680" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="678" height="418" rx="17" fill="none" stroke="rgba(122,240,255,0.22)" stroke-width="1.5"/>
  <text x="36" y="42" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.08em">PYTHAGOREAN RATIOS</text>
<text x="36" y="64" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Monochord divisions — octave, fifth, fourth as audible number</text>
<rect x="60" y="120" width="560" height="28" rx="6" fill="#1a1230" stroke="rgba(122,240,255,0.35)"/>
<line x1="70" y1="134" x2="610" y2="134" stroke="#7af0ff" stroke-width="2" filter="url(#glow)"/>
<circle cx="70" cy="134" r="7" fill="#fbbf24"/><circle cx="610" cy="134" r="7" fill="#fbbf24"/>
<text x="70" y="110" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">nut</text>
<text x="610" y="110" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">bridge</text>
<text x="36" y="190" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Stop positions (vibrating length)</text>
<line x1="610.0" y1="148" x2="610.0" y2="206" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="610.0" cy="134" r="5" fill="#e2e8f0" filter="url(#glow)"/>
<rect x="200" y="202" width="340" height="32" rx="8" fill="rgba(8,10,28,0.65)" stroke="#e2e8f0" stroke-width="1"/>
<text x="214" y="222" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">1</text>
<text x="280" y="222" fill="#d5ddf5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Open string</text>
<line x1="475.0" y1="148" x2="475.0" y2="248" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="475.0" cy="134" r="5" fill="#a78bfa" filter="url(#glow)"/>
<rect x="200" y="244" width="340" height="32" rx="8" fill="rgba(8,10,28,0.65)" stroke="#a78bfa" stroke-width="1"/>
<text x="214" y="264" fill="#a78bfa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">3/4</text>
<text x="280" y="264" fill="#d5ddf5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Fourth (4:3)</text>
<line x1="430.0" y1="148" x2="430.0" y2="290" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="430.0" cy="134" r="5" fill="#34d399" filter="url(#glow)"/>
<rect x="200" y="286" width="340" height="32" rx="8" fill="rgba(8,10,28,0.65)" stroke="#34d399" stroke-width="1"/>
<text x="214" y="306" fill="#34d399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">2/3</text>
<text x="280" y="306" fill="#d5ddf5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Fifth (3:2)</text>
<line x1="340.0" y1="148" x2="340.0" y2="332" stroke="#7af0ff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="340.0" cy="134" r="5" fill="#7af0ff" filter="url(#glow)"/>
<rect x="200" y="328" width="340" height="32" rx="8" fill="rgba(8,10,28,0.65)" stroke="#7af0ff" stroke-width="1"/>
<text x="214" y="348" fill="#7af0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">1/2</text>
<text x="280" y="348" fill="#d5ddf5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Octave (2:1)</text>
  <text x="36" y="402" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Cosmoly diagram</text>
</svg>
